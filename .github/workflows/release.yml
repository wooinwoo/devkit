name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-24.04

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 리눅스 의존성
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 프론트 의존성
        run: npm ci

      - name: 버전·회귀 검사
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-release-version.mjs
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: 빌드 + Release 업로드
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # createUpdaterArtifacts=true 이므로 두 서명 시크릿이 반드시 필요하다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "devkit ${{ github.ref_name }}"
          releaseBody: |
            로컬 문서 뷰어·에디터 데스크톱 앱.
            마크다운(WYSIWYG)·Word(docx)·PDF·엑셀/CSV·PPT·한글(hwp)·이미지·영상·HTML·텍스트를 한 앱에서.

            ## 설치
            - **Windows**: `devkit_*_x64-setup.exe` (NSIS 인스톨러)
            - **macOS**: `devkit_*.dmg` (서명 안 됨, 우클릭 열기)
            - **Linux**: `.AppImage` / `.deb` / `.rpm`

            Tauri 2 · React 19 · 오프라인 동작.
          releaseDraft: true
          prerelease: false

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 모든 설치본 완료 후 릴리스 공개
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

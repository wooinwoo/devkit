name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-24.04

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 리눅스 의존성
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 프론트 의존성
        run: npm install

      - name: 빌드 + Release 업로드
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "devkit ${{ github.ref_name }}"
          releaseBody: |
            로컬 개발자 유틸리티 데스크톱 앱. Cron 표현식 도구 + HTML 라이브 뷰어.

            ## 설치
            - **Windows**: `devkit_*_x64-setup.exe` (NSIS 인스톨러) 또는 `.msi`
            - **macOS**: `devkit_*.dmg` (서명 안 됨 — 우클릭 열기)
            - **Linux**: `.AppImage` / `.deb` / `.rpm`

            Tauri 2 · React 19 · 오프라인 동작.
          releaseDraft: false
          prerelease: false
